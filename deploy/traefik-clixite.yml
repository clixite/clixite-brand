# Routage Traefik (provider fichier) pour les sites Clixite. Copié par le conteneur clixite-sync dans /docker/traefik-svsx/config/clixite-sites.yml.
http:
  routers:
    clixite-sites-www:
      rule: "Host(`www.clixite.be`) || Host(`clixite.be`)"
      entryPoints: [websecure]
      service: clixite-sites
      middlewares:
        # compression à la sortie de nginx (Brotli/zstd/gzip selon Accept-Encoding) ;
        # nginx ne compresse plus lui-même (gzip désactivé dans deploy/nginx.conf)
        - clixite-compress
      priority: 100
      tls:
        certResolver: le
    clixite-sites-charte:
      rule: "Host(`charte.clixite.be`)"
      entryPoints: [websecure]
      service: clixite-sites
      middlewares:
        - clixite-compress
      priority: 100
      tls:
        certResolver: le
  middlewares:
    # Traefik v3 : compress: {} active gzip, Brotli et Zstandard (Brotli prioritaire
    # pour les navigateurs qui l'annoncent) ; les corps déjà compressés sont ignorés.
    clixite-compress:
      compress: {}
  services:
    clixite-sites:
      loadBalancer:
        servers:
          - url: "http://clixite-web:80"
