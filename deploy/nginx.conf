# nginx pour les sites Clixite (conteneur clixite-web, derrière Traefik).
# /usr/share/nginx/html/site = charte.clixite.be (branche site), /usr/share/nginx/html/www = www.clixite.be (branche www).

# hygiène : ne pas exposer la version exacte de nginx (constat P3 de l'audit)
server_tokens off;

# Durée de cache de la charte, par type de contenu (inchangé).
map $sent_http_content_type $clx_expires {
    default                    1h;
    text/html                  5m;
    ~image/                    7d;
    ~video/                    7d;
    ~font/                     30d;
    text/css                   1d;
    application/javascript     1d;
}

# Cache de www.clixite.be, calculé sur l'adresse et non sur le content-type.
# Seuls les fichiers d'Astro sous /_astro/ portent un nom haché : seuls eux reçoivent
# « immutable » pour un an. Le HTML reste à 5 min ; le reste garde les durées
# précédentes (CSS/JS non hachés 1 j, polices 30 j, images et vidéos 7 j, autres 1 h).
map $uri $clx_cache_www {
    default                                   "public, max-age=3600";
    ~^/_astro/                                "public, max-age=31536000, immutable";
    ~*\.html?$                                "public, max-age=300";
    ~/$                                       "public, max-age=300";
    ~*\.(?:css|js|mjs)$                       "public, max-age=86400";
    ~*\.(?:woff2?|ttf|otf|eot)$               "public, max-age=2592000";
    ~*\.(?:png|jpe?g|gif|webp|avif|svg|ico)$  "public, max-age=604800";
    ~*\.(?:mp4|webm|ogv)$                     "public, max-age=604800";
}

# Table des redirections 301 de la migration. L'ancien site Next.js exposait 27 adresses
# (9 chemins x 3 langues : accueil, services, solutions, about, contact, case-studies,
# legal, privacy, terms). Depuis la bascule du 26 octobre 2026 elles répondent 404 sans
# redirection (constat P1 de l'audit). Chaque adresse est listée avec et sans slash final ;
# aucune cible de la table ne figure comme clé, donc aucune redirection ne peut boucler.
# Contrôle : syntaxe nginx validée, puis matrice de tests (aucune boucle, aucune adresse
# existante touchée). Sans default, la valeur par défaut est la chaîne vide.
map $uri $legacy_301 {
    # --- français : anciennes adresses de l'ancien site, sans préfixe de langue ---
    /services                                /expertises/;
    /services/                               /expertises/;
    /solutions                               /expertises/;
    /solutions/                              /expertises/;
    /about                                   /a-propos/;
    /about/                                  /a-propos/;
    /case-studies                            /a-propos/;
    /case-studies/                           /a-propos/;
    /legal                                   /mentions-legales/;
    /legal/                                  /mentions-legales/;
    /privacy                                 /mentions-legales/;
    /privacy/                                /mentions-legales/;
    /terms                                   /mentions-legales/;
    /terms/                                  /mentions-legales/;

    # --- français : /fr/... → adresse sans préfixe (le FR est à la racine) ---
    /fr                                      /;
    /fr/                                     /;
    /fr/services                             /expertises/;
    /fr/services/                            /expertises/;
    /fr/solutions                            /expertises/;
    /fr/solutions/                           /expertises/;
    /fr/about                                /a-propos/;
    /fr/about/                               /a-propos/;
    /fr/contact                              /contact/;
    /fr/contact/                             /contact/;
    /fr/case-studies                         /a-propos/;
    /fr/case-studies/                        /a-propos/;
    /fr/legal                                /mentions-legales/;
    /fr/legal/                               /mentions-legales/;
    /fr/privacy                              /mentions-legales/;
    /fr/privacy/                             /mentions-legales/;
    /fr/terms                                /mentions-legales/;
    /fr/terms/                               /mentions-legales/;

    # --- néerlandais ---
    /nl                                      /nl/;
    /nl/services                             /nl/expertises/;
    /nl/services/                            /nl/expertises/;
    /nl/solutions                            /nl/expertises/;
    /nl/solutions/                           /nl/expertises/;
    /nl/about                                /nl/over-clixite/;
    /nl/about/                               /nl/over-clixite/;
    /nl/contact                              /nl/contact/;
    /nl/case-studies                         /nl/over-clixite/;
    /nl/case-studies/                        /nl/over-clixite/;
    /nl/legal                                /nl/juridische-informatie/;
    /nl/legal/                               /nl/juridische-informatie/;
    /nl/privacy                              /nl/juridische-informatie/;
    /nl/privacy/                             /nl/juridische-informatie/;
    /nl/terms                                /nl/juridische-informatie/;
    /nl/terms/                               /nl/juridische-informatie/;

    # --- anglais ---
    /en                                      /en/;
    /en/services                             /en/expertise/;
    /en/services/                            /en/expertise/;
    /en/solutions                            /en/expertise/;
    /en/solutions/                           /en/expertise/;
    /en/about                                /en/about/;
    /en/contact                              /en/contact/;
    /en/case-studies                         /en/about/;
    /en/case-studies/                        /en/about/;
    /en/legal                                /en/legal-notice/;
    /en/legal/                               /en/legal-notice/;
    /en/privacy                              /en/legal-notice/;
    /en/privacy/                             /en/legal-notice/;
    /en/terms                                /en/legal-notice/;
    /en/terms/                               /en/legal-notice/;

    # --- autres anciennes adresses préfixées : on retire seulement le /fr/ ---
    ~^/fr/?(.+)$                             /$1;
    ~^/fr/?$                                 /;
}

server {
    listen 80;
    server_name charte.clixite.be;
    root /usr/share/nginx/html/site;
    index index.html;
    expires $clx_expires;
    # Compression déléguée à Traefik (middleware compress : Brotli/zstd/gzip), sinon
    # Traefik ne peut pas recompresser un corps déjà compressé par nginx.
    # En-têtes de sécurité minimaux (constat P2 de l'audit). La CSP se limite à
    # frame-ancestors pour ne pas casser d'éventuels scripts inline de la charte.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    location ~* \.(zip|pptx|docx|xlsx|potx|dotx|xltx|plugin|mp4|gif|ttf)$ {
        # add_header n'est pas hérité dès qu'une location en déclare un : on répète les en-têtes de sécurité
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 80;
    server_name www.clixite.be;
    root /usr/share/nginx/html/www;
    index index.html;
    # cache : Cache-Control est calculé par la map $clx_cache_www (plus de directive expires ici)
    add_header Cache-Control $clx_cache_www always;
    # llms.txt, robots.txt et sitemap en UTF-8 (accents lus correctement par les robots et les assistants)
    charset utf-8;
    charset_types text/plain text/xml application/xml application/json application/manifest+json;
    # gzip désactivé : la compression est faite par le middleware compress de Traefik
    # (Brotli en priorité, constat P2 performance de l'audit). Un corps déjà compressé
    # par nginx ne serait ni recompressé ni amélioré par Traefik.
    # en-têtes de sécurité (refonte 2030) ; TLS est terminé par Traefik
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # script-src sans 'unsafe-inline' : les scripts inline sont externalisés côté Astro
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    error_page 404 /404.html;
    # redirections relatives : TLS est terminé par Traefik, nginx ne doit pas fabriquer d'adresse en http
    absolute_redirect off;
    # redirections 301 de la migration (table ci-dessus), avec conservation de la query string
    if ($legacy_301) { return 301 $legacy_301$is_args$args; }
    # soft-404 : /404.html n'est accessible que par error_page, /index.html renvoie vers /
    location = /404.html { internal; }
    location = /index.html {
        # le test porte sur $request_uri (requête du client), pas sur $uri : l'index interne
        # d'un dossier (/ ou /en/) passe aussi par /index.html et doit être servi, sinon boucle
        if ($request_uri ~* "^/index\.html") { return 301 /$is_args$args; }
    }
    # convention : /sitemap.xml pointe vers le sitemap réel du build Astro
    location = /sitemap.xml { return 301 /sitemap-index.xml$is_args$args; }
    # page retirée le 26 octobre 2026 (site centré sur l'entreprise)
    location ~ ^/nicolas-simon/?$ { return 301 /$is_args$args; }
    # versions Markdown des pages pour les assistants IA (llmstxt.org) : lues dans le navigateur, jamais téléchargées
    location ~ \.md$ { types { } default_type "text/markdown; charset=utf-8"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 80;
    server_name clixite.be;
    # HSTS aussi sur l'apex : la réponse 301 doit la porter (constat P2 de l'audit)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://www.clixite.be$request_uri;
}
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
