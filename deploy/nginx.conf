# nginx pour les sites Clixite (conteneur clixite-web, derrière Traefik).
# /usr/share/nginx/html/site = charte.clixite.be (branche site), /usr/share/nginx/html/www = www.clixite.be (branche www).
map $sent_http_content_type $clx_expires {
    default                    1h;
    text/html                  5m;
    ~image/                    7d;
    ~video/                    7d;
    ~font/                     30d;
    text/css                   1d;
    application/javascript     1d;
}
# fichiers d'Astro au nom haché (/_astro/) : contenu immuable, cache d'un an
map $uri $clx_expires_www {
    ~^/_astro/                 1y;
    default                    $clx_expires;
}
server {
    listen 80;
    server_name charte.clixite.be;
    root /usr/share/nginx/html/site;
    index index.html;
    expires $clx_expires;
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
    location ~* \.(zip|pptx|docx|xlsx|potx|dotx|xltx|plugin|mp4|gif|ttf)$ { add_header Content-Disposition attachment; }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 80;
    server_name www.clixite.be;
    root /usr/share/nginx/html/www;
    index index.html;
    expires $clx_expires_www;
    # llms.txt, robots.txt et sitemap en UTF-8 (accents lus correctement par les robots et les assistants)
    charset utf-8;
    charset_types text/plain text/xml application/xml application/json application/manifest+json;
    gzip on; gzip_vary on; gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml application/manifest+json;
    # en-têtes de sécurité (refonte 2030) ; TLS est terminé par Traefik
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    error_page 404 /404.html;
    # redirections relatives : TLS est terminé par Traefik, nginx ne doit pas fabriquer d'adresse en http
    absolute_redirect off;
    # page retirée le 26 octobre 2026 (site centré sur l'entreprise)
    location ~ ^/nicolas-simon/?$ { return 301 /; }
    # versions Markdown des pages pour les assistants IA (llmstxt.org) : lues dans le navigateur, jamais téléchargées
    location ~ \.md$ { types { } default_type "text/markdown; charset=utf-8"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 80;
    server_name clixite.be;
    return 301 https://www.clixite.be$request_uri;
}
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
