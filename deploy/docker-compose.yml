# Sites Clixite (www.clixite.be, clixite.be, charte.clixite.be) sur le VPS srv1352234, derrière traefik-svsx.
# À coller dans hPanel > VPS > Gestionnaire Docker > Composer, nom de projet : clixite-sites.
#   * clixite-sync : toutes les 5 minutes, récupère les branches `site` et `www` du dépôt public
#     github.com/clixite/clixite-brand (zip, sans clé), dépose nginx.conf et le routage Traefik ;
#   * clixite-web : nginx qui sert les deux sites, en lecture seule, sur le réseau "proxy" de Traefik.
# Rien à reconstruire ni à redémarrer pour publier : un push sur main suffit.
services:
  sync:
    image: alpine:3.20
    container_name: clixite-sync
    restart: unless-stopped
    volumes:
      - /var/www/clixite:/www
      - /opt/stacks/clixite-sites:/stack
      - /docker/traefik-svsx/config:/traefik-config
      - clixite-sync-state:/state
    command: >
      sh -c "apk add --no-cache curl unzip >/dev/null 2>&1;
      while true; do
        curl -fsSL https://raw.githubusercontent.com/clixite/clixite-brand/main/deploy/sync.sh -o /tmp/sync.sh && sh /tmp/sync.sh || echo 'sync: échec, nouvel essai dans 5 min';
        sleep 300;
      done"
  web:
    image: nginx:1.27-alpine
    container_name: clixite-web
    restart: unless-stopped
    depends_on:
      - sync
    volumes:
      - /var/www/clixite:/usr/share/nginx/html:ro
      - /opt/stacks/clixite-sites/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
volumes:
  clixite-sync-state:
networks:
  proxy:
    external: true
