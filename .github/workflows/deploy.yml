# Déploiement de charte.clixite.be
#
# À chaque push sur main qui touche charte/, ce workflow :
#   1. publie le contenu de charte/ sur la branche `site` et celui de www/ sur la branche `www` (sans les sources) ;
#      Hostinger (hPanel > Avancé > Git) peut suivre cette branche et se mettre à jour tout seul ;
#   2. si les secrets FTP_SERVER, FTP_USERNAME et FTP_PASSWORD existent, envoie aussi charte/ par FTPS
#      vers le dossier FTP_SERVER_DIR (variable de dépôt, par défaut /public_html/charte/).
# Les deux routes sont indépendantes : l'une ou l'autre suffit.
name: Déployer charte.clixite.be

on:
  push:
    branches: [main]
    paths: ["charte/**", "www/**", "web/**", "ds/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-charte
  cancel-in-progress: true

jobs:
  branche-site:
    name: Publier charte/ sur la branche site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pousser charte/ sur la branche site
        run: |
          git config user.name "clixite-brand bot"
          git config user.email "noreply@clixite.be"
          SHA=$(git subtree split --prefix charte HEAD)
          git push --force origin "$SHA:refs/heads/site"
          echo "Branche site mise à jour : $SHA"
      # www.clixite.be : depuis la refonte 2030, le site est construit avec Astro (web/) puis publié sur la branche www
      - uses: actions/setup-node@v4
        with:
          # Astro 7 exige Node 22.23.4 ou plus récent : version figée, celle des tests locaux (web/.nvmrc)
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Construire www (Astro, contrôle de contraste des tokens inclus)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Publier web/dist sur la branche www
        run: |
          cd web/dist
          git init -q -b www
          git config user.name "clixite-brand bot"
          git config user.email "noreply@clixite.be"
          git add -A
          git commit -q -m "www.clixite.be : build de $GITHUB_SHA"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" www:www
          echo "Branche www mise à jour depuis $GITHUB_SHA"

  ftp:
    name: Envoyer charte/ par FTPS (si les secrets existent)
    runs-on: ubuntu-latest
    needs: branche-site
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les secrets
        id: check
        run: |
          if [ -n "$FTP_SERVER" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Pas de secrets FTP : étape ignorée."; fi
      - name: Déployer par FTPS
        if: steps.check.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./charte/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/charte/' }}
          exclude: |
            **/.git*
            **/.git*/**
